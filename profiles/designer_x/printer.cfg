[include fluidd.cfg]
[include board_pins.cfg]
[include macros.cfg]
[stepper_x]
step_pin: X_STEP
dir_pin: !X_DIR
rotation_distance: 36
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_min: -5
position_endstop: -5
position_max: 200
homing_speed: 18

[tmc2130 stepper_x]
cs_pin: X_CS
diag1_pin: !TMC_DIAG1
spi_software_sclk_pin: TMC_SCK
spi_software_mosi_pin: TMC_SDI
spi_software_miso_pin: TMC_SDO
run_current: 1
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGT: 1

[stepper_y]
step_pin:  Y_STEP
dir_pin: !Y_DIR
rotation_distance: 36
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_min: -5
position_endstop: -5
position_max: 160
homing_speed: 18

[tmc2130 stepper_y]
cs_pin: Y_CS
diag1_pin: !TMC_DIAG1
spi_software_sclk_pin: TMC_SCK
spi_software_mosi_pin: TMC_SDI
spi_software_miso_pin: TMC_SDO
run_current: 1
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGT: 1

[exclude_object]

[force_move]
enable_force_move: True

	
[mcu]
serial: @MCU_SERIAL@
baud: 250000
restart_method: command

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 2000
max_z_velocity: 25
max_z_accel: 60

[idle_timeout] 
timeout: 300000
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached
        M117 Timeout Reached
        TURN_OFF_HEATERS
        M84
    {% endif %}

[extruder]
step_pin: E_STEP
dir_pin: !E_DIR
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 25.13
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: E_HEATER
max_power: 0.60
pwm_cycle_time: 0.010
sensor_type: PT1000
pullup_resistor: 1400
sensor_pin: RTD_HOTEND
min_temp: -10
max_temp: 300
min_extrude_temp: 30
max_extrude_only_distance: 100
control: pid
pid_Kp: 21.833
pid_Ki: 1.323
pid_Kd: 90.062

[verify_heater extruder]
max_error: 500
check_gain_time: 9999

[tmc2130 extruder]
cs_pin: E_CS
spi_software_sclk_pin: TMC_SCK
spi_software_mosi_pin: TMC_SDI
spi_software_miso_pin: TMC_SDO
run_current: 0.55
sense_resistor: 0.1
stealthchop_threshold: 999999

[heater_fan extruder]
heater: extruder
heater_temp: 42.0
kick_start_time: 0.100
max_power: 1.0
pin: FAN_HOTEND

[fan]
pin: FAN_MODEL
kick_start_time: 0.1
cycle_time: 0.01
max_power: 1
off_below: 0.1

[output_pin 24V_RELAY]
pin: FET_RELAY
pwm: False
value: 1
shutdown_value: 0

[heater_bed]
heater_pin: FET_HEATER_BED
sensor_type: Generic 3950
sensor_pin: RTD_BED
pullup_resistor: 4300
max_power: 0.99
pwm_cycle_time: 0.010
min_temp: -40
max_temp: 180
control: pid
pid_Kp: 70.334
pid_Ki: 3.499
pid_Kd: 353.427

[fan_generic FET_CH_FANOUT]
pin: FET_CH_FAN1

[fan_generic FET_CH_FANIN]
pin: FET_CH_FAN2

[led my_led]
red_pin: LED_RED
green_pin:  LED_GREEN
blue_pin:  LED_BLUE
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[filament_switch_sensor filament_sensor]
pause_on_runout: True
runout_gcode:
    M117 Out of Filament
    PAUSE
# event_delay: 3.0
# pause_delay: 0.5
switch_pin: !RTD1_HEAD

[bed_screws]
screw1: 100, 150
screw2: 52, 0
screw3: 146, 0

[firmware_retraction]
retract_length: 0.8
# The length of filament (in mm) to retract when G10 is activated,
# and to unretract when G11 is activated (but see
# unretract_extra_length below). The default is 0 mm.
retract_speed: 20
# The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
# The length (in mm) of *additional* filament to add when
# unretracting.
unretract_speed: 25
# The speed of unretraction, in mm/s. The default is 10 mm/s.
[stepper_z]
step_pin:  Z_STEP
dir_pin:  !Z_DIR
rotation_distance: 4
microsteps: 32
full_steps_per_rotation: 200
endstop_pin:  Z_LS
position_min: -5
position_endstop: 0.465
position_max: 175
homing_speed: 5
homing_retract_dist: 5

[tmc2130 stepper_z]
cs_pin: Z_CS
diag1_pin: !TMC_DIAG1
spi_software_sclk_pin: TMC_SCK
spi_software_mosi_pin: TMC_SDI
spi_software_miso_pin: TMC_SDO
run_current: 1.200
hold_current: 0.600
sense_resistor: 0.1
stealthchop_threshold: 99999


[display]
lcd_type: malevich_panel
encoder_steps_per_detent: 4
panel_reverse_encoder: False
contrast: 239
invert: False
