# Карта электрических цепей. Сам алиас не включает периферию.
# Не используется в printer.cfg != свободен электрически!

[board_pins malevich]
mcu: mcu
aliases:
    X_STEP=PE0, X_DIR=PE7, X_CS=PE11,
    Y_STEP=PE1, Y_DIR=PE8, Y_CS=PE12,
    Z_STEP=PE2, Z_DIR=PE9, Z_CS=PE13,
    E_STEP=PE3, E_DIR=PE10, E_CS=PE14,
    TMC_SCK=PB10, TMC_SDO=PC2, TMC_SDI=PC3, TMC_DIAG1=PE15,
    E_HEATER=PD13, FET_XP7_2=PD13, FET_XP7_1=PD12,
    FET_HEATER_BED=PD14, FET_RELAY=PD3,
    FAN_HOTEND=PC7, FAN_MODEL=PC8, FAN_PART=PC7, FAN_RAD=PC8,
    FET_CH_FAN1=PD15, FET_CH_FAN2=PC6,
    LED_GREEN=PA9, LED_RED=PA10, LED_BLUE=PA11,
    RTD_HOTEND=PA4, RTD_BED=PA6, RTD_CH=PA5,
    RTD1_HEAD=PC0, RTD2_HEAD=PA3, TMC2130_24V_DIV=PA0,
    Z_LS=PC13, BEEPER=PB8,
    FTDI_TX=PD2, FTDI_RX=PC12,
    DEBUG_TX=PC10, DEBUG_RX=PC11,
    LCD_CS=PD5, LCD_RESET=PD6, LCD_DC=PD7,
    LCD_SCLK=PB3, LCD_MISO=PB4, LCD_MOSI=PB5,
    RFID_SCL=PB6, RFID_SDA=PB7, RFID_STATUS=PB9,
    # LCD USB connector data lines; pin aliases only (no host/MSC stack yet).
    USB_HOST_DM=PB14, USB_HOST_DP=PB15,
    SWDIO=PA13, SWCLK=PA14



[duplicate_pin_override]
pins: TMC_DIAG1
