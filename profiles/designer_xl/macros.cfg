[gcode_macro SENSORLESS_HOME_X]
gcode:
    {% set HOME_CUR = 0.400 %}
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_x'] %}
    {% set RUN_CUR = driver_config.run_current %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    G28 X0 F1500
    G90
    G4 P2000
    G28 X0 F1500
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}
    G1 x5
[gcode_macro SENSORLESS_HOME_Y]
gcode:
    {% set HOME_CUR = 0.400 %}
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_y'] %}
    {% set RUN_CUR = driver_config.run_current %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G28 Y0 F1500
    G90
    G4 P2000
    G28 Y0 F1500
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}
[gcode_macro SENSORLESS_HOME_Z]
gcode:
    G0 X5 Y150 F1500
    G28 Z0
[homing_override]
gcode:
    G0 Z60 F1500
    SENSORLESS_HOME_X
    SENSORLESS_HOME_Y
    SENSORLESS_HOME_Z
axes: xyz
set_position_x: 50
set_position_y: 50
set_position_z: 50
[gcode_macro PREHEAT]
gcode:
    {% set extemp = params.EXTRUDER|default(230)|int %}
    {% set bedtemp = params.BED|default(90)|int %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extemp}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedtemp}
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_LED LED=my_led RED=1 GREEN=1 BLUE=1
    TURN_OFF_HEATERS
    G92 E0.0
    G1 E-1 F300
    G91
    G1 X-2 Y-2 Z10 F1500
    G90
    G92 E0.0
    G1 E-2 F300
    G1 X5 Y150 F1500
    BASE_CANCEL_PRINT
[gcode_macro PRINT_START]
gcode:
    SET_LED LED=my_led RED=1 GREEN=0.5 BLUE=0
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    G90
    SET_GCODE_OFFSET Z=0.0
    G28
    G1 Z5 F3000
    G1 Z0.15 F300
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    PRIME_LINE
[gcode_macro PRINT_END]
gcode:
    SET_LED LED=my_led RED=0 GREEN=1 BLUE=0
    TURN_OFF_HEATERS
    G92 E0.0
    G1 E-1 F300
    G91
    G1 X-2 Y-2 Z10 F1500
    G90
    G92 E0.0
    G1 E-2 F300
    G1 X5 Y150 F1500
[gcode_macro PRIME_LINE]
gcode:
    G90
    G1 F1500 X0 Y150 Z0.2
    G92 E0
    G1 F800 Y30 E30
    G92 E0
    G1 F800 X1.5 Y150 E10
    G90
    G1 Z1 F1000
[gcode_macro M205]
gcode:
    {% if 'X' in params %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
    {% elif 'Y' in params %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
    {% endif %}
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    SET_LED LED=my_led RED=1 GREEN=0 BLUE=0
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set x_park = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_park = printer.toolhead.axis_minimum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    SET_LED LED=my_led RED=1 GREEN=0.5 BLUE=0
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% if 'VELOCITY' in params|upper %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
    {% else %}
        {% set get_params = "" %}
    {% endif %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE {get_params}
