# Global G28 for the calibrated Designer XL profile.
# XY homing is guarded by Malevich DIAG Guard; Z uses the PB1 two-stage probe.
[gcode_macro G28]
rename_existing: G28.1
description: Malevich XL guarded XY and PB1 two-stage Z homing
gcode:
    BED_MESH_CLEAR
    {% set all_axes = params.X is not defined and params.Y is not defined and params.Z is not defined %}
    {% set want_x = all_axes or params.X is defined %}
    {% set want_y = all_axes or params.Y is defined %}
    {% set want_z = all_axes or params.Z is defined %}
    {% set homed = printer.toolhead.homed_axes|lower %}
    {% set do_x = want_x or (want_z and 'x' not in homed) %}
    {% set do_y = want_y or (want_z and 'y' not in homed) %}
    {% set x_backoff = printer.configfile.settings['stepper_x'].position_endstop|float + 10.0 %}
    {% set y_backoff = printer.configfile.settings['stepper_y'].position_endstop|float + 10.0 %}

    {% if want_z %}
        # The tested XL mechanism lowers the bed on positive Z before XY moves.
        XL_Z_PREHOME_CLEAR DISTANCE=3 SPEED=2
    {% endif %}

    SAVE_GCODE_STATE NAME=MALEVICH_XL_G28
    G90
    {% if do_x %}
        G28.1 X
        G1 X{x_backoff} F1200
        G4 P2000
    {% endif %}
    {% if do_y %}
        G28.1 Y
        G1 Y{y_backoff} F1200
        G4 P2000
    {% endif %}
    {% if want_z %}
        # Park off-glass, tare PB1, then home at the tested bed center.
        G1 X-10 Y100 F3600
        M400
        G4 P800
        XL_Z_PARK_TARE
        G1 X100 Y100 F3600
        M400
        G4 P600
        XL_Z_HOME_TWO_STAGE TRAVEL={printer.configfile.settings['stepper_z'].position_max|float} COARSE_SPEED=3 COARSE_MV=200 FINE_SPEED=0.15 RETRACT=0.6 FINE_TRAVEL=1.5 CONFIRM=1
    {% endif %}
    RESTORE_GCODE_STATE NAME=MALEVICH_XL_G28 MOVE=0

[gcode_macro PREHEAT]
gcode:
    {% set extemp = params.EXTRUDER|default(230)|int %}
    {% set bedtemp = params.BED|default(90)|int %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extemp}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedtemp}
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_LED LED=my_led RED=1 GREEN=1 BLUE=1
    TURN_OFF_HEATERS
    G92 E0.0
    G1 E-1 F300
    G91
    G1 X-2 Y-2 Z10 F1500
    G90
    G92 E0.0
    G1 E-2 F300
    G1 X5 Y150 F1500
    BASE_CANCEL_PRINT
[gcode_macro PRINT_START]
gcode:
    SET_LED LED=my_led RED=1 GREEN=0.5 BLUE=0
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    G90
    SET_GCODE_OFFSET Z=0.0
    G28
    G1 Z5 F3000
    G1 Z0.15 F300
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    PRIME_LINE
[gcode_macro PRINT_END]
gcode:
    SET_LED LED=my_led RED=0 GREEN=1 BLUE=0
    TURN_OFF_HEATERS
    G92 E0.0
    G1 E-1 F300
    G91
    G1 X-2 Y-2 Z10 F1500
    G90
    G92 E0.0
    G1 E-2 F300
    G1 X5 Y150 F1500
[gcode_macro PRIME_LINE]
gcode:
    G90
    G1 F1500 X0 Y150 Z0.2
    G92 E0
    G1 F800 Y30 E30
    G92 E0
    G1 F800 X1.5 Y150 E10
    G90
    G1 Z1 F1000
[gcode_macro M205]
gcode:
    {% if 'X' in params %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
    {% elif 'Y' in params %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
    {% endif %}
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    SET_LED LED=my_led RED=1 GREEN=0 BLUE=0
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set x_park = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_park = printer.toolhead.axis_minimum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    SET_LED LED=my_led RED=1 GREEN=0.5 BLUE=0
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% if 'VELOCITY' in params|upper %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
    {% else %}
        {% set get_params = "" %}
    {% endif %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{E} F2100
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    RESUME_BASE {get_params}
