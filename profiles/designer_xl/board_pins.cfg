[board_pins malevich]
mcu: mcu
aliases:
    # --- шаговые драйверы (STEP/DIR из рабочего конфига) ---
    X_STEP=PE0,  X_DIR=PE7,  X_CS=PE11,
    Y_STEP=PE1,  Y_DIR=PE8,  Y_CS=PE12,
    Z_STEP=PE2,  Z_DIR=PE9,  Z_CS=PE13,
    E_STEP=PE3,  E_DIR=PE10, E_CS=PE14,

    # --- UART драйверов TMC2209 ---
    TMC_UART=PB10, TMC_DIAG1=PE15, TMC_BANK=PC3,

    # --- вентиляторы / нагреватели ---
    FAN_PART=PC7, FAN_RAD=PC8,
    E_HEATER=PD13,
    FET_RELAY=PD3,
    FET_CH_FAN1=PD15, FET_CH_FAN2=PC6,
    FET_XP7_1=PD12, FET_XP7_2=PD13,
    FET_HEATER_BED=PD14,

    # --- прочее ---
    LED_GREEN=PA9, LED_RED=PA10, LED_BLUE=PA11,
    FTDI_TX=PD2, FTDI_RX=PC12,
    Z_LS=PC13,
    BEEPER=PB8,

    # --- аналоговые входы ---
    RTD1_HEAD=PC0,
    RTD2_HEAD=PA3,
    RTD_CH=PA5,
    RTD_BED=PA6,
    TMC2130_24V_DIV=PA0,

    # LCD connector USB data lines; aliases only until USB Host/MSC is implemented.
    USB_HOST_DM=PB14, USB_HOST_DP=PB15
