# PICASO Designer XL — PB1 nozzle load cell + PA0 PSU voltage monitor.
# Diagnostic only! No probe:z_virtual_endstop; do not G28 Z based on this.
# Remove any old [include xl_adc_test.cfg] to avoid claiming PA0/PB1 twice.
[malevich_xl_inputs]
loadcell_pin: PB1
supply_pin: PA0
adc_reference: 3.3
# Fluke 26.07V / PA0 ADC normalized 0.848107 -> 30.739 V/full-scale.
supply_scale: 30.739
trigger_delta_mv: 50
trigger_direction: rising
filter_samples: 4
report_interval: 0.020
warn_below: 22.0
warn_above: 28.0
