[include fluidd.cfg]
[include board_pins.cfg]
[include macros.cfg]

# ============================================================================
#  PICASO Designer XL, TMC2209 UART on PB10. Klipper selects the driver bank
#  on PC3 through each TMC section's select_pins option.
#  Driver addresses and the 4-Z-driver layout come from the supplied draft
#  and still need to be checked against the v0.6 autodetect report/hardware.
#  База: конфиг с рабочего принтера + разбор открытой XL-прошивки.
#
#  Обозначения:
#    [FW]  — пин подтверждён кодом инициализации прошивки (GPIO/AF/таймер)
#    [CFG] — в прошивке в инициализациях не найден; взят из рабочего конфига,
#            проверить прозвонкой/поведением
#
#  Сверка (подробно — config_audit.md):
#    UART TMC2209 ..... PB10 (USART3_TX) [FW]
#    DIAG 2209 ........ PE15             [FW] (вход)

#    UART5 (FTDI) ..... PC12/PD2        [FW] (AF8)
#    вентиляторы ...... PC6/PC7/PC8     [FW] (TIM3 CH1..3)
#    нагреватели ...... PD13/PD14       [FW] (TIM4)
#    LED RGB .......... PA9/PA10/PA11   [FW] (TIM1 CH2..4)
#    бипер ............ PB8             [FW] (TIM10_CH1, AF3)
#    RTD/ADC .......... PC0/PA3/PA5/PA6/PA4/PA0 [FW]
#    STEP/DIR ......... PE0..PE3 / PE7..PE10    [CFG]
#    реле, Z-концевик . PD3 / PC13              [CFG]
# ============================================================================

[mcu]
serial: @MCU_SERIAL@
baud: 250000
restart_method: command

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 2000
max_z_velocity: 25
max_z_accel: 60

[duplicate_pin_override]
pins: TMC_DIAG1, Z_LS, Z_STEP, Z_DIR

[exclude_object]
[force_move]
enable_force_move: True

[virtual_sdcard]
path: @GCODE_PATH@

[idle_timeout]
timeout: 300          # было 300000 — это 83 часа; обычно 300 (5 мин) или 1800

# ---------------------------------------------------------------------------
# Оси
# ---------------------------------------------------------------------------
[stepper_x]
step_pin: X_STEP
dir_pin: !X_DIR
rotation_distance: 36
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5
position_endstop: -5
position_max: 200
homing_speed: 18

[tmc2209 stepper_x]
uart_pin: TMC_UART
uart_address: 0
diag_pin: ^TMC_DIAG1
run_current: 1
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGTHRS: 60
select_pins: PC3

[stepper_y]
step_pin: Y_STEP
dir_pin: !Y_DIR
rotation_distance: 36
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -5
position_endstop: -5
position_max: 160
homing_speed: 18

[tmc2209 stepper_y]
uart_pin: TMC_UART
uart_address: 1
diag_pin: ^TMC_DIAG1
run_current: 1
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGTHRS: 60
select_pins: PC3

[stepper_z]
step_pin: Z_STEP
dir_pin: !Z_DIR
rotation_distance: 4
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: Z_LS
position_min: -5
# Initial value copied from the Designer X profile; verify on the XL chassis.
position_endstop: 0.465
position_max: 175
homing_speed: 5
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: TMC_UART
uart_address: 0
diag_pin: ^TMC_DIAG1
run_current: 1.200
hold_current: 0.600
sense_resistor: 0.1
stealthchop_threshold: 99999
driver_SGTHRS: 60

# --- Z-плита: 4 мотора (драйверы 6..9 в прошивке) ---------------------------
# В прошивке Z-моторы адресуются как driver 6/7/8/9 -> UART-адреса 0/1/2/3
# второй «банки». STEP/DIR у них, скорее всего, общие с Z (разводка Z-платы);
# если у каждого мотора своя пара STEP/DIR — заменить Z_STEP/Z_DIR на
# прозвоненные пины и убрать их из [duplicate_pin_override].
select_pins: !PC3

[stepper_z1]
step_pin: Z_STEP
dir_pin: !Z_DIR
rotation_distance: 4
microsteps: 32
full_steps_per_rotation: 200
position_min: -5
position_max: 175

[tmc2209 stepper_z1]
uart_pin: TMC_UART
uart_address: 1
diag_pin: ^TMC_DIAG1
run_current: 1.2
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGTHRS: 60
select_pins: !PC3

[stepper_z2]
step_pin: Z_STEP
dir_pin: !Z_DIR
rotation_distance: 4
microsteps: 32
full_steps_per_rotation: 200
position_min: -5
position_max: 175

[tmc2209 stepper_z2]
uart_pin: TMC_UART
uart_address: 2
diag_pin: ^TMC_DIAG1
run_current: 1.2
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGTHRS: 60
select_pins: !PC3

[stepper_z3]
step_pin: Z_STEP
dir_pin: !Z_DIR
rotation_distance: 4
microsteps: 32
full_steps_per_rotation: 200
position_min: -5
position_max: 175

[tmc2209 stepper_z3]
uart_pin: TMC_UART
uart_address: 3
diag_pin: ^TMC_DIAG1
run_current: 1.2
sense_resistor: 0.1
stealthchop_threshold: 0
driver_SGTHRS: 60
select_pins: !PC3

[extruder]
step_pin: E_STEP
dir_pin: E_DIR
microsteps: 16
rotation_distance: 22.5655
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: E_HEATER
max_power: 0.99
pwm_cycle_time: 0.010
min_extrude_temp: 0
max_extrude_only_distance: 10000
max_extrude_cross_section: 10000
gear_ratio: 5:1
# ВНИМАНИЕ: тип датчика и pullup проверить по факту (на плате RTD-входы
# с усилителем; для PT1000 номинал pullup может отличаться от 1400).
sensor_type: PT1000
pullup_resistor: 1400
sensor_pin: PA4
min_temp: -270
max_temp: 270
# Conservative on/off control until this hotend is PID-calibrated.
control: watermark
max_delta: 1.0

[verify_heater extruder]
max_error: 500
check_gain_time: 9999

[tmc2209 extruder]
uart_pin: TMC_UART
uart_address: 3
run_current: 0.8
sense_resistor: 0.1
stealthchop_threshold: 0
select_pins: PC3

[heater_fan extruder]
heater: extruder
heater_temp: 42.0
kick_start_time: 0.100
max_power: 1.0
pin: FAN_PART

# В оригинале [fan] висит на FAN_RAD, а heater_fan — на FAN_PART.
# Если физически обдув детали и радиатор перепутаны — поменять местами.
[fan]
pin: FAN_RAD
kick_start_time: 0.1
cycle_time: 0.01
max_power: 1
off_below: 0.1

[output_pin 24V_RELAY]
pin: FET_RELAY
pwm: False
value: 1
shutdown_value: 0

[heater_bed]
heater_pin: FET_HEATER_BED
# ВНИМАНИЕ: на плате разъём RTD_BED с усилителем. Если там PT100/PT1000 —
# "Generic 3950" не подойдёт, нужен тип RTD/подобранная кривая.
sensor_type: Generic 3950
sensor_pin: RTD_BED
pullup_resistor: 4300
max_power: 0.99
pwm_cycle_time: 0.010
min_temp: -40
max_temp: 180
# Conservative on/off control until this bed is PID-calibrated.
control: watermark
max_delta: 2.0

[fan_generic FET_CH_FANOUT]
pin: FET_CH_FAN1
[fan_generic FET_CH_FANIN]
pin: FET_CH_FAN2

[led my_led]
red_pin: LED_RED
green_pin: LED_GREEN
blue_pin: LED_BLUE
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[filament_switch_sensor filament_sensor]
pause_on_runout: True
runout_gcode:
    M117 Out of Filament
    PAUSE
switch_pin: !RTD1_HEAD

[bed_screws]
screw1: 100, 150
screw2: 52, 0
screw3: 146, 0

[firmware_retraction]
retract_length: 0.8
retract_speed: 20
unretract_extra_length: 0
unretract_speed: 25

# ---------------------------------------------------------------------------
# Макросы (из macro_override.cfg)
# ---------------------------------------------------------------------------

[display]
lcd_type: malevich_panel
encoder_steps_per_detent: 4
panel_reverse_encoder: False
contrast: 239
invert: False
