# PB1 load-cell profile for the tested PICASO Designer XL.
# The 1493 mV threshold and 618 mm search ceiling are machine-calibrated values.
# Do not apply this file to another XL/load cell without calibration.
[malevich_xl_z_probe]
sensor_pin: PB1
supply_pin: PA0
adc_vref: 3.3
supply_fullscale: 30.73
sample_rate: 250
mcu_filter_hz: 8.0
threshold_mv: 1493.0
max_noise_mv: 15.0
tare_window_s: 0.24
tare_wait_s: 2.0
reference_idle_voltage: 1.77
max_idle_deviation_mv: 300.0
raw_min_voltage: 0.20
raw_max_voltage: 3.30
allow_homing: False
arm_required: False
require_park_tare: True
park_x: -10
park_x_max: 0
park_settle_s: 0.6
park_max_age_s: 300
park_max_noise_mv: 300.0
park_previous_limit_mv: 500.0
park_recheck_mv: 200.0
park_safe_z: 2.0
auto_park_probe: True
enable_probe_bridge: True
allow_probing: True
probe_two_stage: True
probe_coarse_speed: 3.0
probe_coarse_threshold_mv: 200.0
probe_coarse_retract_mm: 2.0
probe_coarse_travel_mm: 8.0
probe_fine_travel_mm: 4.0
max_probe_speed: 0.75
max_probe_travel_mm: 20.0
z_offset: 0.0
speed: 0.15
lift_speed: 2.0
samples: 1
sample_retract_dist: 2.0
limited_home_retract_mm: 2.0

# Calibrated, bounded glass zone from the tested XL example.
[bed_mesh]
speed: 50
horizontal_move_z: 2.0
mesh_min: 30,30
mesh_max: 300,280
probe_count: 3,3
algorithm: lagrange
