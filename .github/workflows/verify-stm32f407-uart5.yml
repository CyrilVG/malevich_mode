name: STM32F407 firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH)
        type: string
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout Klipper
        uses: actions/checkout@v4
        with:
          repository: Klipper3d/klipper
          ref: ee2c6fb6b00b2b5d097ef70d0868df7d74943b51
          path: upstream-klipper
      - name: Validate SWD flashing guides
        shell: bash
        run: |
          set -euo pipefail
          for guide in docs/flashing/{README,st-link,cmsis-dap,flipper-zero,raspberry-pi-gpio}.md; do
            test -s "$guide"
            grep -q '^## Русский' "$guide"
            grep -q '^## English' "$guide"
          done
      - name: Install ARM toolchain and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi zip unzip
      - name: Apply patches and build
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-klipper
          for patch in ../patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cp ../panel/src/malevich_panel.c ../panel/src/malevich_logo.h src/
          echo 'src-y += malevich_panel.c' >> src/Makefile
          printf '%s\n' \
            'CONFIG_LOW_LEVEL_OPTIONS=y' \
            'CONFIG_MACH_STM32=y' \
            'CONFIG_MACH_STM32F407=y' \
            'CONFIG_STM32_FLASH_START_0000=y' \
            'CONFIG_STM32_CLOCK_REF_25M=y' \
            'CONFIG_STM32_SERIAL_UART5_PC12_PD2=y' \
            'CONFIG_SERIAL_BAUD=250000' > .config
          make olddefconfig
          grep -qx 'CONFIG_MACH_STM32F407=y' .config
          grep -qx 'CONFIG_STM32_SERIAL_UART5_PC12_PD2=y' .config
          grep -qx 'CONFIG_SERIAL_BAUD=250000' .config
          make -j2
          test -s out/klipper.bin
          test -s out/klipper.dict
          python3 ../scripts/verify-mcu-build.py out/klipper.dict
      - name: Test panel firmware state machine and host installer
        run: |
          gcc -std=gnu11 -O2 -I panel/tests/stubs -o /tmp/test-panel panel/tests/test_panel.c
          /tmp/test-panel
          python3 -m compileall -q panel/host panel/install.py
          python3 panel/install.py --klipper upstream-klipper
          python3 panel/install.py --klipper upstream-klipper
          python3 -m compileall -q upstream-klipper/klippy/extras/display
          python3 - <<'PYTEST'
          import json
          d = json.load(open('upstream-klipper/out/klipper.dict'))
          assert d['config']['MALEVICH_PANEL_VERSION'] == 1
          for prefix in ('panel_start ', 'panel_frame ', 'panel_query ', 'panel_get_status'):
              assert any(k.startswith(prefix) for k in d['commands']), prefix
          PYTEST
      - name: Package and verify downloads
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v0.2.0' }}
        run: |
          bash scripts/package-firmware.sh "$VERSION" upstream-klipper/out dist
          cp -r panel dist/panel
          cp upstream-klipper/out/klipper.elf dist/klipper.elf
          cp upstream-klipper/.config dist/build.config
          cp upstream-klipper/out/klipper.dict dist/klipper.dict
          cd dist
          zip -X -q -r malevich-panel-host-and-source.zip panel build.config klipper.dict
          cd ..
          grep -q '^## Русский$' README.md
          grep -q '^## English$' README.md
          grep -q '^## Русский$' dist/RELEASE_NOTES.md
          grep -q '^## English$' dist/RELEASE_NOTES.md
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: klipper-stm32f407-uart5
          path: |
            dist/*.bin
            dist/*.zip
            dist/*SUMS.txt
            dist/RELEASE_NOTES.md
            dist/build.config
            dist/klipper.dict
            dist/klipper.elf
          if-no-files-found: error
